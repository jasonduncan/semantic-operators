# Offline tests (no API keys, no model downloads) on every push and pull request.
# The publish workflow also runs these before anything is released.
name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # [typesafe]: the real TypeSafe SDK with a fake HTTP layer. [mcp]: the MCP server
      # over an in-process session. Not [laya] (it would download torch).
      - run: uv run --python ${{ matrix.python }} --extra typesafe --extra mcp pytest -q
