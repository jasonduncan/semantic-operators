[project]
name = "semantic-operators"
version = "0.6.0"
description = "One small, provider-neutral interface for System One models (TypeSafe's Jev, Laya, and compatibles)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Duncan" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["system-one", "jev", "laya", "typesafe", "classification", "llm", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jasonduncan/semantic-operators"
Source = "https://github.com/jasonduncan/semantic-operators"
Issues = "https://github.com/jasonduncan/semantic-operators/issues"

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.1"]
laya = ["laya>=0.3.20"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
